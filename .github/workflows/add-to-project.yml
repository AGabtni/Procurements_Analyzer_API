name: Add issues to roadmap
on:
  issues:
    types: [opened, reopened]
jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.1
        with:
          project-url: https://github.com/users/AGabtni/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}