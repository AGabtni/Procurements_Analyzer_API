name: "✨ Feature / Enhancement"
description: Propose a new capability or improvement for ProcurePortal.
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a feature. Keep it scoped to one service where possible.
        Cross-service work should be filed as an **Epic** in the `ProcurePortal` home-base repo
        with child issues in each affected service repo.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system does this touch?
      options:
        - API
        - Dashboard
        - Scraper
        - Infra
        - Cross-cutting
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - critical / blocking
        - P1 - high
        - P2 - normal
        - P3 - low / nice-to-have
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be built, and why? One or two sentences.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / context
      description: What problem does this solve? Link any roadmap item, doc, or related issue.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of what "done" looks like.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Implementation notes (optional)
      description: Files, endpoints, tables, or approach hints.
    validations:
      required: false
